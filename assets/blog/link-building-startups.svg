<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#E0F2FE"/>
  
  <!-- People climbing chart -->
  <g transform="translate(150, 350)">
    <circle cx="0" cy="0" r="20" fill="#3B82F6"/>
    <ellipse cx="0" cy="30" rx="15" ry="25" fill="#60A5FA"/>
  </g>
  
  <!-- Chart bars -->
  <rect x="200" y="300" width="80" height="100" rx="8" fill="#93C5FD"/>
  <rect x="320" y="250" width="80" height="150" rx="8" fill="#60A5FA"/>
  <rect x="440" y="180" width="80" height="220" rx="8" fill="#3B82F6"/>
  <rect x="560" y="120" width="80" height="280" rx="8" fill="#2563EB"/>
  
  <!-- Person on top -->
  <g transform="translate(600, 80)">
    <circle cx="0" cy="0" r="18" fill="#3B82F6"/>
    <path d="M-15 20 L15 20 L10 50 L-10 50 Z" fill="#60A5FA"/>
    <line x1="-20" y1="25" x2="-35" y2="15" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="25" x2="35" y2="15" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Rocket/Growth icon -->
  <path d="M680 200 L700 160 L720 200 L700 190 Z" fill="#EF4444"/>
  <ellipse cx="700" cy="205" rx="20" ry="8" fill="#F87171"/>
  <circle cx="700" cy="180" r="5" fill="#FEF3C7"/>
</svg>