<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#DBEAFE"/>
  
  <!-- Search/Magnifying glass -->
  <circle cx="250" cy="200" r="80" fill="#FFFFFF" stroke="#3B82F6" stroke-width="8"/>
  <circle cx="250" cy="200" r="60" fill="#E0F2FE"/>
  <rect x="300" y="260" width="20" height="100" rx="10" fill="#3B82F6" transform="rotate(45 310 310)"/>
  
  <!-- SEO text representation -->
  <circle cx="250" cy="200" r="30" fill="#3B82F6"/>
  <text x="250" y="210" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SEO</text>
  
  <!-- People working -->
  <g transform="translate(500, 180)">
    <circle cx="0" cy="0" r="25" fill="#3B82F6"/>
    <rect x="-20" y="30" width="40" height="50" rx="5" fill="#60A5FA"/>
    <!-- Computer -->
    <rect x="-30" y="85" width="60" height="40" rx="4" fill="#1F2937"/>
    <rect x="-25" y="90" width="50" height="30" rx="2" fill="#60A5FA"/>
  </g>
  
  <g transform="translate(650, 200)">
    <circle cx="0" cy="0" r="22" fill="#10B981"/>
    <rect x="-18" y="25" width="36" height="45" rx="5" fill="#34D399"/>
    <!-- Tablet -->
    <rect x="-20" y="75" width="40" height="50" rx="3" fill="#1F2937"/>
    <rect x="-17" y="78" width="34" height="40" rx="2" fill="#34D399"/>
  </g>
  
  <!-- Chat bubbles -->
  <ellipse cx="420" cy="120" rx="45" ry="30" fill="#FFFFFF"/>
  <circle cx="410" cy="115" r="5" fill="#3B82F6"/>
  <circle cx="420" cy="115" r="5" fill="#3B82F6"/>
  <circle cx="430" cy="115" r="5" fill="#3B82F6"/>
</svg>